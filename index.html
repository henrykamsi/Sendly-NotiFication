    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {

        input, textarea, select { font-family: inherit; outline: none; border: none; background: none; color: inherit; }

        #sendly-loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 11, 14, 0.94); backdrop-filter: blur(16px);
            z-index: 9999999; display: none; flex-direction: column;
            justify-content: center; align-items: center; gap: 24px;
        }
        #sendly-loader.show { display: flex; }
        .loader-wrapper { width: 120px; height: 120px; display: flex; justify-content: center; align-items: center; }
        .access-svg { width: 100%; height: 100%; }
        .layer-center {
            transform-origin: 100px 100px;
            animation: centerAnim 2s cubic-bezier(0.25, 1, 0.5, 1) infinite;
        }
        .layer-middle {
            transform-origin: 100px 100px;
            animation: middleAnim 2s cubic-bezier(0.25, 1, 0.5, 1) infinite;
        }
        .layer-outer {
            transform-origin: 100px 100px;
            animation: outerAnim 2s cubic-bezier(0.25, 1, 0.5, 1) infinite;
        }
        @keyframes centerAnim {
            0% { transform: scale(0.5); opacity: 0.4; }
            25%, 75% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.5); opacity: 0.4; }
        }
        @keyframes middleAnim {
            0%, 15% { transform: scale(0.2); opacity: 0; }
            35%, 70% { transform: scale(1); opacity: 1; }
            90%, 100% { transform: scale(0.2); opacity: 0; }
        }
        @keyframes outerAnim {
            0%, 30% { transform: scale(0.2); opacity: 0; }
            50%, 65% { transform: scale(1); opacity: 1; }
            85%, 100% { transform: scale(0.2); opacity: 0; }
        }
        #sendly-loader .loader-text { font-size: 16px; font-weight: 500; color: #a0a0aa; letter-spacing: 0.5px; }
        #sendly-loader .loader-text span { color: #00f2fe; }

        .app-container { max-width: 720px; margin: 0 auto; padding: 20px 16px 100px; display: none; flex: 1; }
        .app-container.active { display: block; }

        }

        .btn-sm { padding: 8px 16px; font-size: 12px; }
        .btn-group { display: flex; gap: 10px; flex-wrap: wrap; }

        .btn-download-green {
            background: #22c55e;
            color: #ffffff;

            border-radius: 10px;

        .stats-grid {
            display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px;
        }
        .stat-box {
            background: #0f0f12; border: 1px solid #22222a; border-radius: 12px; padding: 14px 10px; text-align: center;

        .stat-box .label { font-size: 11px; color: #6a6a76; margin-top: 2px; }

        .app-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 14px 16px; background: #0f0f12; border: 1px solid #22222a; border-radius: 12px;
            margin-bottom: 10px; transition: 0.2s; position: relative;
            cursor: pointer;

        body.light-mode .app-item { background: #f7f7fa; border-color: #d9d9e0; }
        .app-item:hover { border-color: #00f2fe; }
        .app-item .info { flex: 1; }

        .app-menu-dropdown button:hover { background: #00f2fe18; color: #00f2fe; }
        .app-menu-dropdown button:last-child:hover { color: #ff453a; }

        /* ============================================================
           NOTIFICATION ITEMS
           ============================================================ */
        .notif-item {
            background: #0f0f12; border: 1px solid #22222a; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px;
            position: relative;
        }
        body.light-mode .notif-item { background: #f7f7fa; border-color: #d9d9e0; }

            border-color: #ff453a;

        }
        .notif-item .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .notif-item .header .title { font-weight: 600; font-size: 14px; }
        .notif-item .header .time { font-size: 12px; color: #6a6a76; }
        .notif-item .stats { display: flex; gap: 14px; font-size: 12px; color: #6a6a76; flex-wrap: wrap; }
        .notif-item .actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .notif-item .countdown { font-size: 13px; color: #ff453a; font-weight: 600; }
        .notif-item .scheduled-badge {
            position: absolute; top: -6px; right: -6px;
            background: #ff453a; color: #fff; font-size: 10px;
            padding: 2px 10px; border-radius: 12px; font-weight: 600;
        }

        .empty-state { text-align: center; padding: 40px 16px; }
        .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
        .empty-state h3 { color: #6a6a76; font-size: 16px; }
        .empty-state p { color: #4a4a56; font-size: 14px; max-width: 280px; margin: 4px auto 0; }

        .glowing-box {
            background: #0f0f12; border: 1px solid #00f2fe; border-radius: 12px;
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.3), inset 0 0 10px rgba(0, 242, 254, 0.1);
            padding: 16px; position: relative; margin-top: 16px;
            animation: glowPulse 2s infinite alternate;
        }
        body.light-mode .glowing-box { background: #ffffff; }
        @keyframes glowPulse {
            0% { box-shadow: 0 0 15px rgba(0, 242, 254, 0.3), inset 0 0 8px rgba(0, 242, 254, 0.1); }
            100% { box-shadow: 0 0 25px rgba(0, 242, 254, 0.6), inset 0 0 15px rgba(0, 242, 254, 0.2); }
        }
        .glowing-box .copy-btn {
            position: absolute; top: 12px; right: 12px;
            background: linear-gradient(135deg, #00f2fe, #4facfe); color: #000;
            border: none; padding: 6px 14px; border-radius: 6px; font-size: 12px; font-weight: 700;
            cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; z-index: 10;
        }
        .glowing-box .copy-btn:hover { transform: scale(1.05); box-shadow: 0 4px 12px rgba(0, 242, 254, 0.4); }
        .glowing-box .code-block {
            background: transparent; border: none; padding: 32px 0 0 0; margin: 0;
            max-height: 300px; overflow-y: auto; color: #00f2fe;
            font-family: 'SF Mono', 'Courier New', monospace; font-size: 13px;
            word-break: break-all; user-select: all;
        }

        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(11, 11, 14, 0.92); backdrop-filter: blur(20px);
            z-index: 999999; display: none; justify-content: center; align-items: center; padding: 24px;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: #151518; border: 1px solid #2a2a30; border-radius: 20px;
            max-width: 480px; width: 100%; padding: 32px 28px; text-align: center; animation: modalIn 0.3s ease;
            max-height: 80vh; overflow-y: auto;
        }
        body.light-mode .modal-box { background: #ffffff; border-color: #d9d9e0; }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.96) translateY(16px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .modal-box .icon { font-size: 44px; margin-bottom: 8px; }
        .modal-box h2 { font-size: 22px; font-weight: 700; color: #e8e8ec; margin-bottom: 4px; }
        body.light-mode .modal-box h2 { color: #1c1c1e; }
        .modal-box p { color: #6a6a76; font-size: 14px; line-height: 1.6; margin-bottom: 16px; }
        .modal-box .code-block {
            background: #0f0f12; border: 1px solid #2a2a30; border-radius: 10px; padding: 14px;
            font-family: 'SF Mono', 'Courier New', monospace; font-size: 13px; color: #00f2fe;
            word-break: break-all; user-select: all; margin-bottom: 16px;
        }

        .subscriber-item {
